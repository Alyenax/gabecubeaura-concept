name: Build mobile Audio Sync fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate precomputed Audio Sync frames
        run: |
          python -m pip install --disable-pip-version-check numpy
          python tools/generate_audio_analysis.py

      - name: Verify generated browser code
        run: |
          node --check app.js
          node --check audio-analysis.js
          git diff --check
          grep -q 'audio-analysis.js' index.html
          grep -q 'audio-analysis.js' audio-sync/index.html
          grep -q 'readPrecomputedAudioFrame' app.js
          python - <<'PY'
          from pathlib import Path
          text = Path('audio-analysis.js').read_text(encoding='utf-8')
          assert len(text) > 1000
          assert 'silksong' in text and 'witcher-bear' in text
          print('audio-analysis.js sanity check:', len(text), 'bytes')
          PY

      - name: Commit verified fix to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/fix-mobile-audio-sync-main.yml
          git rm --ignore-unmatch .audio-sync-build-request
          git add app.js audio-analysis.js index.html audio-sync/index.html tools/generate_audio_analysis.py
          if git diff --cached --quiet; then
            echo "Generated output is already up to date."
            exit 0
          fi
          git commit -m "Fix mobile Audio Sync with precomputed analysis"
          git push origin HEAD:${{ github.head_ref }}
