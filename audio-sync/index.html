<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c131b">
  <meta name="description" content="See GabeCubeAura Audio Sync on a simulated 17-pixel Steam Machine light bar, preloaded with Silksong, Slow Prism and Screen Sync colours.">
  <title>Audio Sync · GabeCubeAura Concept Lab</title>
  <link rel="canonical" href="https://alyenax.github.io/gabecubeaura-concept/audio-sync/">
</head>
<body style="margin:0;background:#0c131b;color:#eef6ff;font:16px system-ui,sans-serif">
  <noscript>JavaScript is required for the Audio Sync simulator.</noscript>
  <div id="routeLoader" style="min-height:100vh;display:grid;place-items:center">Loading Audio Sync…</div>
  <script>
    (async () => {
      const requestedUrl = location.pathname + location.search + location.hash;
      window.__GABECUBEAURA_AUDIO_SYNC_ROUTE__ = requestedUrl;
      history.replaceState(null, '', new URL('../?audio-sync-loader=1', location.href));

      const response = await fetch('index.html', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Concept Lab request failed (${response.status})`);
      let html = await response.text();
      const closeScript = '</scr' + 'ipt>';
      const appTag = '<script src="app.js" defer>' + closeScript;
      const patchTag = '<script src="audio-sync-mobile-fix.js" defer>' + closeScript;
      if (!html.includes(appTag)) throw new Error('Could not locate app.js in Concept Lab');

      html = html.replace('<head>', '<head>\n  <base href="./">');
      html = html.replace(' controls autoplay muted playsinline loop ', ' controls muted playsinline loop ');
      html = html.replace(appTag, appTag + '\n  ' + patchTag);
      html = html.replace(
        '<title>GabeCubeAura Concept Lab</title>',
        '<title>Audio Sync · GabeCubeAura Concept Lab</title>'
      );

      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      const loader = document.getElementById('routeLoader');
      if (loader) loader.textContent = `Audio Sync could not start: ${error.message || error}`;
    });
  </script>
</body>
</html>
